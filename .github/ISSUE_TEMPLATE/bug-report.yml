name: Bug report
description: Report a problem with Lord of the Halo.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        **This report will be public.** Search existing issues first. Review pasted output and attachments; remove personal details, tokens, and private paths. New reports from the connected website form are public after explicit consent. Earlier private reports stay private.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose the system or compatibility setup used to play the game.
      options:
        - Linux
        - Windows
        - Steam Deck
        - Windows build via Proton
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Copy the version shown in the game, including the build label if available.
      placeholder: "Version or build label"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the game mode, location, and whether the problem happens every time.
      placeholder: |
        1. Start ...
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any visible error message.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Optional system information

        Include only OS family/version, CPU model, RAM amount, graphics card model and driver version if useful. Do not paste raw diagnostic dumps, hostnames, account names, serials, network addresses or file paths.

        The connected website form validates and previews these fields before sending. This direct GitHub form cannot run those checks; omit system information if you are unsure.

  - type: textarea
    id: system-info
    attributes:
      label: Reviewed system information (optional)
      description: Only OS/version, CPU model, RAM, GPU model and driver. No raw system logs or identifying details.
      render: text
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Include relevant screenshots or other details after reviewing them for private information.
